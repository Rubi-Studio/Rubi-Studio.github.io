<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubi Studio</title>
    <link rel="stylesheet" href="..\style\style.css">
</head>

<body>
    <div id="header-container"></div>
    <main>
    <h1>Curriculum Vitae</h1>
    <p>Más adelante estará aquí mi CV</p>
    </main>
</body>

    <div id="footer-container"></div>

<script>
        // Función para cargar contenido HTML externo
        async function loadHTML(url, elementId) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Error al cargar ${url}: ${response.status}`);
                const html = await response.text();
                document.getElementById(elementId).innerHTML = html;
                return true;
            } catch (error) {
                console.error(error);
                return false;
            }
        }
    
        // Cargar header y footer
        document.addEventListener('DOMContentLoaded', async () => {
            // Cargar header desde la subcarpeta "classes"
            await loadHTML('../classes/header.html', 'header-container');
            
            // Resaltar enlace activo en el nav
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            const navLinks = document.querySelectorAll('nav a');
            
            navLinks.forEach(link => {
                const linkPage = link.getAttribute('href');
                if (currentPage === linkPage) {
                    link.classList.add('active');
                }
            });
    
            // Cargar footer desde la subcarpeta "classes"
            await loadHTML('../classes/footer.html', 'footer-container');
        });
    </script>

</html>
